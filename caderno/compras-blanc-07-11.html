<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compras Blanc House</title><style>body{font:18px system-ui;background:#f4f5f7;color:#17212b;max-width:650px;margin:auto;padding:20px}h1{font-size:26px}label{display:flex;gap:14px;align-items:center;background:white;margin:8px 0;padding:16px;border-radius:12px}input{width:25px;height:25px;flex-shrink:0}.done{text-decoration:line-through;opacity:.55}p{font-size:15px}button{padding:12px}</style><h1>Compras Blanc House</h1><p>Festa 07/11 • 150 pessoas<br>Somente manuscrito. Itens com ? precisam de confirmação.</p><p id="count"></p><main id="list"></main><p>As marcações ficam salvas neste navegador se ele permitir armazenamento local. Mantenha o arquivo aberto durante as compras.</p><script>const items=['5 kg açúcar','3 kg arroz','8 kg macarrão • confirmar tipo','2 farofas prontas • confirmar tamanho','1 farinha de quibe • confirmar tamanho','1 azeite • confirmar volume','1 margarina • confirmar tamanho/marca','200 g mussarela','Parmesão • quantidade parece 4, confirmar ?','1 gorgonzola • confirmar peso','1 saco azeitona • confirmar tipo/tamanho','1 litro bebida • descrição ilegível, confirmar ?','2 litros leite','10 caixas creme de leite','2 saquinhos champignon','2 sazón de legumes','3 kg carne picada','2 kg contrafilé','6 kg peito de frango','2 kg linguiça churrasco','3 bandejas calabresa','1 saco ovo de codorna','2,5 kg carne moída','8 leites condensados','2 farinhas Panco ?','20 ovos','1 iogurte • confirmar tamanho','Milho • linha parcialmente riscada, confirmar quantidade ?','4 óleos','Papel toalha • aparece 2 e outra menção, confirmar total ?','4 detergentes • marca ilegível','1 maionese','1 mostarda ?','1 cheiro-verde • aparece duas vezes; confirmar total ?','Abóbora • parece 5, confirmar quantidade/unidade ?','6 cabeças alho','Tomates • quantidade rasurada, confirmar ?','2 pimentões','6 cebolas ?','8 abacaxis','25 goiabas','5 maracujás','6 bandejas morango','5 kiwis','15 limões','3 alfaces crespas','2 sacos canudinhos','200 palitinhos','8 guardanapos • confirmar se pacotes','300 cumbucas ?','300 copos drink','200 copos 200 ml','Papel filme','1 fósforo'];let done={};try{done=JSON.parse(localStorage.getItem('blanc-071126')||'{}')}catch(e){}function render(){const list=document.getElementById('list');list.replaceChildren();items.map((text,id)=>({text,id})).sort((a,b)=>Number(!!done[a.id])-Number(!!done[b.id])||a.id-b.id).forEach(({text,id})=>{const l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');c.type='checkbox';c.checked=!!done[id];l.className=c.checked?'done':'';s.textContent=text;c.onchange=()=>{done[id]=c.checked;try{localStorage.setItem('blanc-071126',JSON.stringify(done))}catch(e){}render()};l.append(c,s);list.append(l)});document.getElementById('count').textContent=items.filter((_,i)=>done[i]).length+' de '+items.length+' marcados'}render();</script></html>
